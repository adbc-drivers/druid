name: druid

services:
  test-service:
    image: apache/druid:36.0.0
    platform: linux/amd64
    working_dir: /opt/druid
    entrypoint: ["/bin/bash", "/opt/druid/ci/start-druid.sh"]
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --output-document=/dev/null
        - --header=Content-Type:application/json
        - '--post-data={"query":"SELECT 1"}'
        - http://127.0.0.1:8888/druid/v2/sql
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s
    ports:
      - "8888:8888"
    stop_grace_period: 1m
    volumes:
      - ./ci/docker/druid/start-druid.sh:/opt/druid/ci/start-druid.sh:ro
      - druid-data:/opt/druid/var

volumes:
  druid-data:
