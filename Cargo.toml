[package]
name = "adbc-driver-druid"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"

[dependencies]
adbc_core = "0.22.0"
adbc_ffi = "0.22.0"
arrow-array = "57"
arrow-buffer = "57"
arrow-schema = "57"
arrow-select = "57"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lib]
crate-type = ["lib", "cdylib"]

[lints.clippy]
pedantic = "warn"
