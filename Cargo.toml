[package]
name = "adbc-driver-druid"
version = "0.1.0-alpha.1"
license = "Apache-2.0"
edition = "2024"

[dependencies]
adbc_core = "0.24.0"
adbc_ffi = "0.24.0"
arrow-array = "59.3"
arrow-buffer = "59.3"
arrow-schema = "59.3"
arrow-select = "59.3"
chrono = { version = "0.4.44", default-features = false, features = ["std"] }
percent-encoding = "2"
reqwest = { version = "0.13.2", features = ["json", "blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lib]
crate-type = ["lib", "cdylib"]

[lints.clippy]
pedantic = "warn"
